<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product Review Form – WDD 131 – Gabriel Alexander Silva Enriquez</title>

  <meta name="description" content="A product review submission form for WDD 131 – Dynamic Web Fundamentals, by Gabriel Alexander Silva Enriquez. Demonstrates HTML forms and JavaScript DOM interaction.">
  <meta name="author" content="Gabriel Alexander Silva Enriquez">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/form.css">

  <script src="scripts/getdates.js" defer></script>
  <script src="scripts/form.js" defer></script>
</head>
<body>

  <main class="form-page">

    <form class="review-form" method="get" action="review.html">

      <h1>Product Review</h1>

      <div class="field">
        <label for="product">Product Name</label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a Product ...</option>
          <!-- Remaining options are populated dynamically by form.js -->
        </select>
      </div>

      <fieldset class="field rating-field">
        <legend>Overall Rating</legend>

        <div class="rating-group">

          <div class="rating-option">
            <label for="rating-1">&star;</label>
            <input type="radio" id="rating-1" name="rating" value="1" required>
          </div>

          <div class="rating-option">
            <label for="rating-2">&star;&star;</label>
            <input type="radio" id="rating-2" name="rating" value="2" required>
          </div>

          <div class="rating-option">
            <label for="rating-3">&star;&star;&star;</label>
            <input type="radio" id="rating-3" name="rating" value="3" required>
          </div>

          <div class="rating-option">
            <label for="rating-4">&star;&star;&star;&star;</label>
            <input type="radio" id="rating-4" name="rating" value="4" required>
          </div>

          <div class="rating-option">
            <label for="rating-5">&star;&star;&star;&star;&star;</label>
            <input type="radio" id="rating-5" name="rating" value="5" required>
          </div>

        </div>
      </fieldset>

      <div class="field">
        <label for="installDate">Date of Installation</label>
        <input type="date" id="installDate" name="installDate" required>
      </div>

      <fieldset class="field">
        <legend>Which features did you find useful in the product? <span class="optional">(Check all that apply)</span></legend>

        <div class="checkbox-row">
          <input type="checkbox" id="feature-durability" name="features" value="Durability">
          <label for="feature-durability">Durability</label>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="feature-ease" name="features" value="Ease of Use">
          <label for="feature-ease">Ease of Use</label>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="feature-performance" name="features" value="Performance">
          <label for="feature-performance">Performance</label>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="feature-design" name="features" value="Design">
          <label for="feature-design">Design</label>
        </div>
      </fieldset>

      <div class="field">
        <label for="review">Written Review <span class="optional">(Optional)</span></label>
        <textarea id="review" name="review" rows="5"></textarea>
      </div>

      <div class="field">
        <label for="username">Your Name <span class="optional">(Optional)</span></label>
        <input type="text" id="username" name="username">
      </div>

      <div class="field submit-field">
        <input type="submit" value="Post Review">
      </div>

    </form>

  </main>

  <footer>
    <p>
      &copy; <span id="currentyear"></span>
      Gabriel Alexander Silva Enriquez, Quito, Ecuador
    </p>
    <p id="lastModified"></p>
  </footer>

</body>
</html>
