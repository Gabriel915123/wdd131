<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Review Submitted – WDD 131 – Gabriel Alexander Silva Enriquez</title>

  <meta name="description" content="Confirmation page for the WDD 131 product review form, by Gabriel Alexander Silva Enriquez.">
  <meta name="author" content="Gabriel Alexander Silva Enriquez">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/form.css">

  <script src="scripts/getdates.js" defer></script>
  <script src="scripts/review.js" defer></script>
</head>
<body>

  <main class="form-page">

    <section class="review-form">

      <h1>Thank You!</h1>

      <div class="field">
        <p id="review-count" class="review-count"></p>
      </div>

      <div class="field">
        <label>Product</label>
        <p id="summary-product"></p>
      </div>

      <div class="field">
        <label>Overall Rating</label>
        <p id="summary-rating"></p>
      </div>

      <div class="field">
        <label>Date of Installation</label>
        <p id="summary-date"></p>
      </div>

      <div class="field">
        <label>Useful Features</label>
        <p id="summary-features"></p>
      </div>

      <div class="field">
        <label>Written Review</label>
        <p id="summary-review"></p>
      </div>

      <div class="field">
        <label>Submitted By</label>
        <p id="summary-username"></p>
      </div>

      <div class="field submit-field">
        <a href="form.html" class="back-link">&larr; Submit Another Review</a>
      </div>

    </section>

  </main>

  <footer>
    <p>
      &copy; <span id="currentyear"></span>
      Gabriel Alexander Silva Enriquez, Utah, USA
    </p>
    <p id="lastModified"></p>
  </footer>

</body>
</html>
